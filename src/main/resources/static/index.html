<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaga</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="hud">
            <div class="hud-item">1UP <span id="score">00000</span></div>
            <div class="hud-item">HIGH SCORE <span id="hiscore">00000</span></div>
            <div class="hud-item">STAGE <span id="stage">1</span></div>
            <div class="hud-item">FIGHTERS <span id="lives">2</span></div>
        </header>

        <canvas id="game" width="480" height="720"></canvas>

        <div id="overlay" class="overlay">
            <h1>GALAGA</h1>
            <p class="legend">
                <span>&#x25C0; &#x25B6;</span> Move &nbsp; <span>SPACE</span> Fire &nbsp; <span>P</span> Pause
            </p>
            <button id="startBtn">START</button>
            <div class="scores">
                <h2>BEST 10</h2>
                <ol id="scoreList"></ol>
            </div>
        </div>

        <div id="gameOver" class="overlay hidden">
            <h1 id="gameOverTitle">GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Stage Reached: <span id="finalStage">1</span></p>
            <div id="nameEntry">
                <label>Enter your name:
                    <input id="playerName" maxlength="12" autocomplete="off" />
                </label>
                <button id="saveScoreBtn">SAVE</button>
            </div>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>

        <div id="stageBanner" class="banner hidden"><span id="stageText">STAGE 1</span></div>

        <footer>
            <p>Mobile: tap left/right of ship to move &middot; tap top half to fire</p>
        </footer>
    </div>

    <script src="/game.js"></script>
</body>
</html>
